# Configuration golangci-lint v2 (v2.15.0) — gates du principe IV.
version: "2"

run:
  timeout: 5m
  # Analyser aussi les tests à étiquette de build (D-LL-007).
  build-tags:
    - integration

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosec
    - ineffassign
    - unused
    - revive
    - gocritic
    - bodyclose
  # misspell (correcteur anglais) est volontairement désactivé : le contenu pédagogique,
  # les commentaires et les tests sont en français (principe II) et produiraient des
  # faux positifs.
  settings:
    errcheck:
      # Écrire un message sur le terminal ne peut pas être rattrapé utilement.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofumpt
