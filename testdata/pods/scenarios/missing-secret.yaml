apiVersion: v1
kind: Pod
metadata:
  name: missing-secret
  labels:
    telemach/scenario: missing-secret
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
  containers:
  - name: app
    image: busybox:1.38
    command: ["sleep", "3600"]
    env:
    - name: API_TOKEN
      valueFrom:
        secretKeyRef: {name: api-absent, key: token}
    securityContext: {allowPrivilegeEscalation: false}
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 100m, memory: 32Mi}
