apiVersion: v1
kind: Pod
metadata:
  name: oom
  labels:
    telemach/scenario: oom
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
  containers:
  - name: app
    image: busybox:1.38
    command: ["sh", "-c", "tail /dev/zero"]
    securityContext: {allowPrivilegeEscalation: false}
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 100m, memory: 32Mi}
