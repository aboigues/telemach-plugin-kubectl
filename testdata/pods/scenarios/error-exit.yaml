apiVersion: v1
kind: Pod
metadata:
  name: error-exit
  labels:
    telemach/scenario: error-exit
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
  restartPolicy: Never
  containers:
  - name: app
    image: busybox:1.38
    command: ["sh", "-c", "echo 'fichier de configuration introuvable' >&2; exit 2"]
    securityContext: {allowPrivilegeEscalation: false}
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 100m, memory: 32Mi}
