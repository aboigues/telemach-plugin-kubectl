apiVersion: v1
kind: Pod
metadata:
  name: missing-configmap
  labels:
    telemach/scenario: missing-configmap
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
  containers:
  - name: app
    image: busybox:1.38
    command: ["sleep", "3600"]
    envFrom:
    - configMapRef: {name: config-absente}
    securityContext: {allowPrivilegeEscalation: false}
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 100m, memory: 32Mi}
