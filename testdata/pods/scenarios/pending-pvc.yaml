apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: donnees
spec:
  storageClassName: classe-inexistante
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: v1
kind: Pod
metadata:
  name: pending-pvc
  labels:
    telemach/scenario: pending-pvc
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
  volumes:
  - name: donnees
    persistentVolumeClaim: {claimName: donnees}
  containers:
  - name: app
    image: nginxinc/nginx-unprivileged:1.30-alpine
    volumeMounts:
    - {name: donnees, mountPath: /donnees}
    securityContext: {allowPrivilegeEscalation: false}
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 100m, memory: 32Mi}
