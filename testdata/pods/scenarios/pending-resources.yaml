apiVersion: v1
kind: Pod
metadata:
  name: pending-resources
  labels:
    telemach/scenario: pending-resources
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
  containers:
  - name: app
    image: nginxinc/nginx-unprivileged:1.30-alpine
    securityContext: {allowPrivilegeEscalation: false}
    resources:
      requests: {cpu: "100", memory: 64Mi}
      limits: {cpu: "100", memory: 128Mi}
