apiVersion: v1
kind: Pod
metadata:
  name: invalid-image-name
  labels:
    telemach/scenario: invalid-image-name
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
  containers:
  - name: app
    image: NGINX:Majuscules
    securityContext: {allowPrivilegeEscalation: false}
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 100m, memory: 32Mi}
