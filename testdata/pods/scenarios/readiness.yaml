apiVersion: v1
kind: Pod
metadata:
  name: readiness
  labels:
    telemach/scenario: readiness
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
  containers:
  - name: app
    image: nginxinc/nginx-unprivileged:1.30-alpine
    readinessProbe:
      httpGet: {path: /, port: 9999}
      periodSeconds: 2
    securityContext: {allowPrivilegeEscalation: false}
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 100m, memory: 32Mi}
