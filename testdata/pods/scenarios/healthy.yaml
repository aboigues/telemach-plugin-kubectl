apiVersion: v1
kind: Pod
metadata:
  name: healthy
  labels:
    telemach/scenario: healthy
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
  containers:
  - name: app
    image: nginxinc/nginx-unprivileged:1.30-alpine
    securityContext: {allowPrivilegeEscalation: false}
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 100m, memory: 32Mi}
