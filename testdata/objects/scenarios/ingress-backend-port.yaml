# Scénario W8 : Ingress qui vise un port que le Service n'expose pas (feature 002, quickstart). Manifestes seulement : les attentes sont
# dans testdata/objects/<cas>/expected.yaml (LL-004, LL-005).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wrong-port
spec:
  ingressClassName: demo
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hello
            port: {number: 8080}
