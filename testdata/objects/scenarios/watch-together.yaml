# Scénario W11 : Service et Deployment appliqués ensemble (pods pas encore créés : transitoire) (feature 002, quickstart). Manifestes seulement : les attentes sont
# dans testdata/objects/<cas>/expected.yaml (LL-004, LL-005).
apiVersion: v1
kind: Service
metadata:
  name: together
spec:
  selector:
    app: together
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: together
spec:
  replicas: 1
  selector:
    matchLabels:
      app: together
  template:
    metadata:
      labels:
        app: together
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
      - name: app
        image: nginxinc/nginx-unprivileged:1.30-alpine
        ports:
        - containerPort: 8080
        securityContext: {allowPrivilegeEscalation: false}
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 64Mi}
