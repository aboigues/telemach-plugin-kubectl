# Scénario W8 : Ingress qui vise un Service inexistant (feature 002, quickstart). Manifestes seulement : les attentes sont
# dans testdata/objects/<cas>/expected.yaml (LL-004, LL-005).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
spec:
  ingressClassName: demo
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: absent
            port: {number: 80}
