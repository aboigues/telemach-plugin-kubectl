# Scénario W9 : PVC qui demande une classe de stockage inexistante (feature 002, quickstart). Manifestes seulement : les attentes sont
# dans testdata/objects/<cas>/expected.yaml (LL-004, LL-005).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fast-data
spec:
  storageClassName: rapide
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 16Mi}
