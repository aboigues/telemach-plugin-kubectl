# Relevé : trois répliques qui refusent de partager un nœud, pour deux workers (feature 004, quickstart). Manifestes seulement : les attentes sont dans
# testdata/objects/<cas>/expected.yaml (LL-004, LL-005).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anti
spec:
  replicas: 3
  selector:
    matchLabels:
      app: anti
  template:
    metadata:
      labels:
        app: anti
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app: anti
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
      - name: web
        image: nginxinc/nginx-unprivileged:1.30-alpine
        securityContext: {allowPrivilegeEscalation: false}
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 64Mi}
