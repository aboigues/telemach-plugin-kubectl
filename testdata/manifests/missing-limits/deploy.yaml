# Conteneur sans resources.limits (feature 004, FR-004) : information de check.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: web
        image: nginxinc/nginx-unprivileged:1.30-alpine
        securityContext:
          allowPrivilegeEscalation: false
        resources:
          requests: {cpu: 50m, memory: 64Mi}
