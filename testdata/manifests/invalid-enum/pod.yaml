apiVersion: v1
kind: Pod
metadata:
  name: web
spec:
  restartPolicy: Allways
  securityContext:
    runAsNonRoot: true
  containers:
  - name: web
    image: nginxinc/nginx-unprivileged:1.30-alpine
    securityContext:
      allowPrivilegeEscalation: false
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 200m, memory: 128Mi}
