# Gates obligatoires du projet (principe IV de la constitution).
# Toutes les actions tierces sont épinglées par SHA de commit complet (vérifiés le 2026-10-16,
# et le 2026-10-19 pour celles de la publication).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Appelé par release.yml : les mêmes gates sont rejouées sur le commit d'un tag de version.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          # Compilation avec la chaîne d'outils du projet (Go 1.27), voir D-LL-001.
          install-mode: goinstall

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Installer zsh (tests de l'intégration shell)
        # Un miroir apt bloqué a figé un job plus d'une heure (LL-011) : échec rapide et explicite.
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
      - name: Tests unitaires et de régression
        run: go test -race -cover ./...
      # -p 1 : un paquet à la fois, pour qu'une mesure ne se dispute pas le processeur avec une autre.
      - name: Objectifs de latence (sans le détecteur de courses, qui fausse les mesures)
        run: go test -p 1 -count=1 -run 'Latency' -v ./internal/diagnose/ ./cmd/kubectl-telemach/ ./tests/shell/
      - name: Couverture des paquets internal/ (80 % minimum)
        run: scripts/couverture 80

  build:
    # Version injectée à la compilation (research R12).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique et tags complets : nécessaires à git describe.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Compiler avec la version issue du tag git
        # Sur un tag v0.1.0 : « 0.1.0 » ; après le tag : « 0.1.0-3-gabc1234 » ; sans tag :
        # le commit abrégé. La version est injectée par -ldflags (main.version).
        run: |
          version="$(git describe --tags --match 'v[0-9]*' --always --dirty)"
          version="${version#v}"
          echo "Version : ${version}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          go build -trimpath -ldflags "-X main.version=${version}" -o "$RUNNER_TEMP/kubectl-telemach" ./cmd/kubectl-telemach
      - name: Vérifier la version affichée
        run: |
          first_line="$("$RUNNER_TEMP/kubectl-telemach" version | head -n 1)"
          if [ "${first_line}" != "TELEMACH PLUGIN KUBECTL ${VERSION}" ]; then
            echo "::error::version affiche « ${first_line} » au lieu de la version ${VERSION}"
            exit 1
          fi
          echo "${first_line}"

  goreleaser-check:
    # Configuration de publication valide et snapshot complet : binaires, archives, sommes, SBOM.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Installer Syft (SBOM)
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1
      - name: Rendre Syft accessible à GoReleaser
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: dirname "$SYFT" >> "$GITHUB_PATH"
      - name: Vérifier la configuration GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: check
      - name: Construire un snapshot (sans signature ni image)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --snapshot --clean --skip=sign,docker
      - name: Vérifier les artefacts contre le contrat (noms, archives, sommes, SBOM, version, reproductibilité)
        env:
          DIST_DIR: dist
        run: go test -tags dist -count=1 -v ./tests/release/...

  image-scan:
    # Image construite à partir d'un snapshot, contrôlée (taille, utilisateur, binaires) puis
    # analysée par Grype (principe IV). Trivy est écarté depuis la compromission de
    # trivy-action (research R8).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Construire l'image snapshot (linux/amd64 et linux/arm64)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --snapshot --clean --skip=sign,sbom
      - name: Repérer les images
        id: image
        run: |
          version="$(jq -r .version dist/metadata.json)"
          echo "repo=docker.io/telemachlearning/telemach-kubectl:${version}" >> "$GITHUB_OUTPUT"
      - name: Contrôler taille, utilisateur et binaires de chaque image (SC-007, FR-013, FR-014)
        env:
          REPO: ${{ steps.image.outputs.repo }}
        run: |
          max=15000000
          for arch in amd64 arm64; do
            ref="${REPO}-${arch}"
            user="$(docker image inspect --format '{{.Config.User}}' "$ref")"
            if [ "$user" != "65532:65532" ]; then
              echo "::error::$ref : utilisateur « $user » au lieu de 65532:65532"
              exit 1
            fi
            size="$(docker save "$ref" | gzip -c | wc -c)"
            echo "$ref : ${size} octets compressés"
            if [ "$size" -ge "$max" ]; then
              echo "::error::$ref pèse ${size} octets compressés (maximum ${max}, SC-007)"
              exit 1
            fi
            id="$(docker create "$ref")"
            mkdir -p "extrait/$arch"
            docker cp "$id:/opt/telemach/linux/kubectl-telemach" "extrait/$arch/linux"
            docker cp "$id:/opt/telemach/darwin/kubectl-telemach" "extrait/$arch/darwin"
            docker rm "$id" > /dev/null
            for os in linux darwin; do
              got="$(sha256sum < "extrait/$arch/$os" | cut -d' ' -f1)"
              want="$(awk -v f="_${os}_${arch}" '$2 ~ f"$" {print $1}' dist/checksums.txt)"
              if [ -z "$want" ] || [ "$got" != "$want" ]; then
                echo "::error::$ref : le binaire $os n'a pas la somme de checksums.txt (FR-013)"
                exit 1
              fi
            done
          done
      - name: Analyser l'image (vulnérabilités hautes et critiques bloquantes)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ steps.image.outputs.repo }}-amd64
          grype-version: v0.120.1
          fail-build: true
          severity-cutoff: high
          only-fixed: false
          output-format: table

  krew-manifest:
    # Le manifeste Krew généré depuis un snapshot est valide et s'installe sur les quatre
    # plateformes depuis les archives (research R9, FR-011) ; sans réseau ni kubectl.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Construire un snapshot (archives seulement)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --snapshot --clean --skip=sign,docker,sbom
      - name: Installer krew et validate-krew-manifest v0.5.0 (chaîne d'outils du projet, D-LL-001)
        run: |
          go install sigs.k8s.io/krew/cmd/krew@v0.5.0
          go install sigs.k8s.io/krew/cmd/validate-krew-manifest@v0.5.0
      - name: Générer et valider le manifeste, installer chaque plateforme
        run: |
          version="$(jq -r .version dist/metadata.json)"
          go run ./scripts/krew-manifest -allow-prerelease -checksums dist/checksums.txt \
            -version "$version" -base-url "https://example.invalid" -out "$RUNNER_TEMP/telemach.yaml"
          validate-krew-manifest -skip-install -manifest "$RUNNER_TEMP/telemach.yaml"
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${platform%/*}"; arch="${platform#*/}"
            root="$(mktemp -d)"
            KREW_ROOT="$root" KREW_OS="$os" KREW_ARCH="$arch" krew install \
              --manifest="$RUNNER_TEMP/telemach.yaml" \
              --archive="dist/kubectl-telemach_${version}_${os}_${arch}.tar.gz"
            for f in kubectl-telemach LICENSE NOTICE; do
              if ! ls "$root"/store/telemach/*/"$f" > /dev/null; then
                echo "::error::$platform : $f absent après l'installation par Krew"
                exit 1
              fi
            done
            echo "$platform : installé par Krew"
          done

  dockerfile-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer hadolint v2.15.1 (somme de contrôle vérifiée)
        run: |
          curl -sSfL -o hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  hadolint" | sha256sum -c -
          chmod +x hadolint
      - name: Lint des Dockerfile livrés (testdata/ exclu)
        run: |
          mapfile -t files < <(git ls-files -- '*Dockerfile' '*.Dockerfile' ':!:testdata/**')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Aucun Dockerfile livré : rien à vérifier."
            exit 0
          fi
          ./hadolint "${files[@]}"

  manifest-lint:
    # Manifestes Kubernetes du dépôt : validation par les règles embarquées et règles de
    # sécurité (principe IV). Réussit tant qu'aucun manifeste n'existe.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Contrôle des manifestes (catalogue, testdata/manifests/valid, testdata/pods/scenarios)
        run: go test -count=1 -v ./tests/manifests/...

  integration-kind:
    # Cluster kind jetable, une version de Kubernetes par entrée de la matrice (D-LL-015 :
    # jamais d'autre cluster que celui créé par le test).
    runs-on: ubuntu-latest
    timeout-minutes: 45 # ≈ 15 min avec trois nœuds et T1 à T13 de la feature 004 (LL-011)
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubectl: v1.35.10
            image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          - kubectl: v1.36.6
            image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          - kubectl: v1.37.2
            image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Installer zsh
        # Un miroir apt bloqué a figé un job plus d'une heure (LL-011) : échec rapide et explicite.
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
      - name: Installer kind v0.33.0 (module vérifié par la base de sommes Go)
        run: go install sigs.k8s.io/kind@v0.33.0
      - name: Installer kubectl ${{ matrix.kubectl }} (somme SHA-256 vérifiée)
        env:
          KUBECTL_VERSION: ${{ matrix.kubectl }}
        run: |
          curl -sSfL -o kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "$(curl -sSfL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256")  kubectl" | sha256sum -c -
          chmod +x kubectl
          mkdir -p "$HOME/.local/bin" && mv kubectl "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Scénarios du quickstart sur un cluster kind jetable
        env:
          TELEMACH_KIND_IMAGE: ${{ matrix.image }}
        # -v : chaque scénario apparaît par son nom dans le journal, PASS ou SKIP (D-LL-009).
        run: go test -tags integration -count=1 -v -timeout 40m ./tests/integration/...

  integration:
    # Check obligatoire unique : les checks d'une matrice portent un suffixe
    # (« integration-kind (v1.35.9, …) ») et ne peuvent pas être déclarés « required » tels quels.
    if: always()
    needs: integration-kind
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Résultat des trois versions de Kubernetes
        env:
          RESULT: ${{ needs.integration-kind.result }}
        run: |
          echo "integration-kind : ${RESULT}"
          test "${RESULT}" = "success"

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        # Compilé avec la chaîne d'outils du projet (D-LL-001).
        env:
          GOTOOLCHAIN: go1.27.3
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Installer gitleaks v8.30.1 (somme de contrôle vérifiée)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Recherche de secrets dans tout l'historique
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose .

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
