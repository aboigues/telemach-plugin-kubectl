# Pièges silencieux d'un Deployment (feature 002, US2) : la commande a réussi, mais la nouvelle
# version n'arrive pas, ou les pods gardent l'ancienne image ou l'ancienne configuration
# (research.md S3, S5). Chaque entrée est choisie par son identifiant de piège.

- id: rollout.stalled
  category: rollout
  pitfalls: [rollout.stalled]
  concept:
    name: rollout
    definition: >-
      Un Deployment remplace ses pods version par version : il crée un nouveau ReplicaSet et
      n'arrête les anciens pods qu'à mesure que les nouveaux sont prêts. Tant que la nouvelle
      version n'est pas prête, l'ancienne continue de servir.
  summary: Le déploiement de « {{.deployment}} » est bloqué, sa nouvelle version ne démarre pas.
  cause: >-
    Les pods de la nouvelle version ({{.newImage}}) ne sont pas prêts après l'échéance de
    {{.deadline}} s{{if .reason}} : le pod « {{.pod}} » est en {{.reason}}{{end}}.{{if .oldImage}}
    L'ancienne version ({{.oldImage}}, {{.oldReady}} pod(s) prêt(s)) répond toujours : c'est
    pourquoi l'application semble fonctionner.{{end}} Kubernetes ne revient pas en arrière de
    lui-même.
  fixes:
    - description: Comprendre pourquoi le nouveau pod ne démarre pas.
      command: '{{.kubectl}} telemach diagnose pod/{{.pod}} {{.scope}}'
      safe: true
    - description: Corriger le manifeste puis le réappliquer ; ou, si tu préfères revenir tout de suite à la version précédente, la restaurer.
      command: '{{.kubectl}} rollout undo deployment/{{.deployment}} {{.scope}}'
      safe: true
    - description: Suivre ensuite le déploiement jusqu'au bout.
      command: '{{.kubectl}} rollout status deployment/{{.deployment}} {{.scope}}'
      safe: true
  deepen:
    explanation: >-
      L'échéance de progression (progressDeadlineSeconds, 600 s par défaut) ne fait que
      constater le blocage : le Deployment passe à Progressing=False, raison
      ProgressDeadlineExceeded, mais rien n'est annulé. C'est un symptôme ; la cause est dans
      les pods de la nouvelle version.
    example: |-
      kubectl rollout history deployment/web
      kubectl get replicasets -l app=web
    exercise: >-
      Crée un namespace d'exercice avec « kubectl create namespace exo-rollout », déploie
      nginx-unprivileged:1.30-alpine, mets à jour l'image vers un tag inexistant, observe
      les deux ReplicaSets avec « kubectl get rs », puis reviens en arrière avec
      « kubectl rollout undo ». Supprime le namespace ensuite.
  doc_url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#failed-deployment
  tests: [rollout-stalled]

- id: rollout.progressing
  category: rollout
  pitfalls: [rollout.progressing]
  concept:
    name: rollout
    definition: >-
      Un Deployment remplace ses pods version par version ; pendant ce temps, le rollout est
      « en cours » jusqu'à ce que tous les pods de la nouvelle version soient prêts.
  summary: Le déploiement de « {{.deployment}} » est en cours ({{.newReady}}/{{.desired}} pod(s) prêt(s)).
  cause: >-
    La nouvelle version ({{.newImage}}) n'est pas encore entièrement prête, mais l'échéance de
    {{.deadline}} s n'est pas atteinte : c'est normal pendant un démarrage, il suffit
    d'attendre.{{if .reason}} Le pod « {{.pod}} » est toutefois en {{.reason}} : le
    déploiement risque de se bloquer.{{end}}
  fixes:
    - description: Suivre le déploiement jusqu'au bout.
      command: '{{.kubectl}} rollout status deployment/{{.deployment}} {{.scope}}'
      safe: true
    - description: Voir l'état des pods de chaque version.
      command: '{{.kubectl}} get pods -l {{.selector}} {{.scope}}'
      safe: true
  deepen:
    explanation: >-
      maxSurge et maxUnavailable règlent la vitesse d'un rollout : combien de pods en plus
      peuvent démarrer, et combien peuvent manquer, pendant le remplacement.
    example: |-
      kubectl explain deployment.spec.strategy.rollingUpdate
    exercise: >-
      Crée un namespace d'exercice avec « kubectl create namespace exo-progression »,
      déploie nginx-unprivileged avec une readinessProbe qui attend 60 s, et suis le rollout
      avec « kubectl rollout status ». Supprime le namespace ensuite.
  doc_url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#progressing-deployment
  tests: [rollout-progressing]

- id: rollout.paused
  category: rollout
  pitfalls: [rollout.paused]
  concept:
    name: rollout en pause
    definition: >-
      Un Deployment en pause (kubectl rollout pause) enregistre les modifications de son modèle
      de pod sans les déployer, et son échéance de progression n'est plus évaluée.
  summary: Le Deployment « {{.deployment}} » est en pause, ses modifications ne sont pas déployées.
  cause: >-
    Tant que le Deployment est en pause, une nouvelle image ou une nouvelle configuration ne
    crée aucun nouveau pod : les pods actuels ({{.oldImage}}{{if not .oldImage}}{{.newImage}}{{end}})
    continuent de tourner.
  fixes:
    - description: Reprendre le déploiement quand tu es prêt.
      command: '{{.kubectl}} rollout resume deployment/{{.deployment}} {{.scope}}'
      safe: true
  deepen:
    explanation: >-
      La pause sert à regrouper plusieurs modifications en un seul rollout : on met en pause,
      on change l'image et les ressources, puis on reprend.
    example: |-
      kubectl rollout pause deployment/web
      kubectl rollout resume deployment/web
    exercise: >-
      Crée un namespace d'exercice avec « kubectl create namespace exo-pause », mets un
      Deployment en pause, change son image, constate qu'aucun pod n'est recréé, puis reprends
      le rollout. Supprime le namespace ensuite.
  doc_url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#pausing-and-resuming-a-deployment
  tests: [rollout-paused]

- id: rollout.complete
  category: rollout
  pitfalls: [rollout.complete]
  concept:
    name: rollout
    definition: >-
      Un rollout est terminé quand tous les pods de la version demandée sont prêts : le
      Deployment ne garde plus de pod d'une version précédente.
  summary: Le Deployment « {{.deployment}} » est entièrement déployé, {{.ready}}/{{.desired}} pod(s) prêt(s).
  cause: >-
    La version en service est {{.image}}. Si l'application ne répond pas, le problème est
    sans doute en aval : vérifie le Service qui l'expose.
  fixes:
    - description: Voir l'historique des versions de ce Deployment.
      command: '{{.kubectl}} rollout history deployment/{{.deployment}} {{.scope}}'
      safe: true
    - description: Vérifier les Services du namespace.
      command: '{{.kubectl}} get services {{.scope}}'
      safe: true
  deepen:
    explanation: >-
      Chaque modification du modèle de pod crée une révision ; kubectl rollout history les
      liste, et kubectl rollout undo --to-revision=N revient à l'une d'elles.
    example: |-
      kubectl rollout history deployment/web
    exercise: >-
      Crée un namespace d'exercice avec « kubectl create namespace exo-revisions », change
      deux fois l'image d'un Deployment, puis lis son historique de révisions. Supprime le
      namespace ensuite.
  doc_url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
  tests: [healthy]

- id: image.mutable-tag
  category: rollout
  pitfalls: [image.mutable-tag]
  concept:
    name: image tag
    definition: >-
      Le tag désigne la version d'une image. Un tag comme latest (ou l'absence de tag) peut
      désigner une autre image d'un jour à l'autre, sans que le manifeste change.
  summary: L'image « {{.image}} » n'a pas de tag explicite, un nouvel apply ne la mettra pas à jour.
  cause: >-
    Réappliquer un manifeste dont l'image s'écrit pareil ne crée aucun nouveau pod : pour
    Kubernetes, rien n'a changé. Les pods existants gardent l'image qu'ils ont téléchargée,
    même si une nouvelle a été publiée sous le même nom.
  fixes:
    - description: Écrire un tag de version explicite dans le manifeste (par exemple 1.30-alpine), puis réappliquer.
      command: '{{.kubectl}} set image deployment/{{.deployment}} CONTENEUR=IMAGE:VERSION {{.scope}}'
      safe: true
    - description: Pour une version figée, référencer l'image par son digest (@sha256:…).
      command: '{{.kubectl}} get pods -l {{.selector}} {{.scope}} -o jsonpath=''{.items[*].status.containerStatuses[*].imageID}'''
      safe: true
  deepen:
    explanation: >-
      Un tag explicite rend un déploiement reproductible et réversible : on sait quelle
      version tourne, et kubectl rollout undo revient à une version connue. imagePullPolicy:
      Always ne règle rien : il retélécharge l'image au démarrage d'un pod, mais ne redémarre
      pas les pods existants.
    example: |-
      kubectl get pods -o jsonpath='{.items[*].status.containerStatuses[*].imageID}'
    exercise: >-
      Crée un namespace d'exercice avec « kubectl create namespace exo-tag », déploie
      nginx-unprivileged sans tag, réapplique le même manifeste et constate qu'aucun pod n'est
      recréé ; recommence avec un tag explicite que tu changes. Supprime le namespace ensuite.
  doc_url: https://kubernetes.io/docs/concepts/containers/images/#image-names
  tests: [mutable-tag]

- id: config.env-stale
  category: config
  pitfalls: [config.env-stale]
  concept:
    name: configuration figée au démarrage
    definition: >-
      Les variables d'environnement d'un conteneur, et les fichiers montés avec subPath, sont
      lus une seule fois, au démarrage du pod. Modifier ensuite la ConfigMap ne change rien
      pour les pods déjà démarrés.
  summary: La ConfigMap « {{.configmap}} » a changé après le démarrage des pods de « {{.deployment}} », qui gardent l'ancienne valeur.
  cause: >-
    La ConfigMap a été modifiée le {{.modified}}, après le démarrage du plus ancien pod
    ({{.started}}). Elle est utilisée par : {{.refs}}. Ces valeurs sont figées au démarrage.
  fixes:
    - description: Redémarrer les pods du Deployment, qui reliront la configuration (redémarrage progressif, sans coupure).
      command: '{{.kubectl}} rollout restart deployment/{{.deployment}} {{.scope}}'
      safe: true
    - description: Suivre le redémarrage jusqu'au bout.
      command: '{{.kubectl}} rollout status deployment/{{.deployment}} {{.scope}}'
      safe: true
  deepen:
    explanation: >-
      Un volume ConfigMap monté sans subPath est mis à jour par le kubelet au bout de quelques
      dizaines de secondes, mais l'application doit relire le fichier. Les variables
      d'environnement et les montages subPath, eux, demandent un redémarrage du pod.
    example: |-
      kubectl rollout restart deployment/web
    exercise: >-
      Crée un namespace d'exercice avec « kubectl create namespace exo-config », crée une
      ConfigMap utilisée en variable d'environnement, modifie-la, vérifie avec « kubectl exec
      … -- env » que le pod garde l'ancienne valeur, puis redémarre le Deployment. Supprime le
      namespace ensuite.
  doc_url: https://kubernetes.io/docs/concepts/configuration/configmap/#mounted-configmaps-are-updated-automatically
  tests: [config-env-stale]

- id: config.secret-env
  category: config
  pitfalls: [config.secret-env]
  concept:
    name: configuration figée au démarrage
    definition: >-
      Les variables d'environnement issues d'un Secret, comme celles d'une ConfigMap, sont lues
      au démarrage du pod ; un Secret modifié ensuite n'est pas pris en compte.
  summary: Les pods de « {{.deployment}} » lisent le Secret « {{.secret}} » au démarrage, une modification ne leur parviendra pas.
  cause: >-
    TELEMACH ne lit jamais le contenu d'un Secret : il ne peut pas savoir si « {{.secret}} »
    a changé. Utilisation : {{.refs}}. Si tu viens de le modifier, redémarre les pods.
  fixes:
    - description: Redémarrer les pods du Deployment après une modification du Secret.
      command: '{{.kubectl}} rollout restart deployment/{{.deployment}} {{.scope}}'
      safe: true
  deepen:
    explanation: >-
      Monter un Secret en volume (sans subPath) permet à l'application de relire sa nouvelle
      valeur sans redémarrer, si elle surveille le fichier ; les variables d'environnement
      exigent un redémarrage.
    example: |-
      kubectl explain pod.spec.volumes.secret
    exercise: >-
      Crée un namespace d'exercice avec « kubectl create namespace exo-secret », crée un
      Secret avec « kubectl create secret generic demo --from-file=./valeur.txt », utilise-le
      en variable d'environnement, modifie-le et redémarre le Deployment. Supprime le
      namespace ensuite.
  doc_url: https://kubernetes.io/docs/concepts/configuration/secret/
  tests: [config-env]

- id: rollout.progress-deadline
  category: rollout
  patterns:
    - 'deployment "(?P<deployment>[^"]+)" exceeded its progress deadline'
  concept:
    name: échéance de progression
    definition: >-
      Un Deployment attend que sa nouvelle version soit prête pendant
      spec.progressDeadlineSeconds (600 s par défaut). Au-delà, il se déclare bloqué : la
      condition Progressing passe à False, et kubectl rollout status échoue.
  summary: Le déploiement de « {{.deployment}} » est bloqué, sa nouvelle version n'est pas prête après l'échéance.
  cause: >-
    Les pods de la nouvelle version ne deviennent pas prêts (image introuvable, plantage au
    démarrage, sonde en échec…). Kubernetes ne revient pas en arrière de lui-même : l'ancienne
    version, s'il en reste, continue de servir.
  fixes:
    - description: Diagnostiquer le Deployment et le pod en difficulté de sa nouvelle version.
      command: '{{.kubectl}} telemach diagnose deployment/{{.deployment}}{{if .scope}} {{.scope}}{{end}}'
      safe: true
    - description: Revenir à la version précédente si tu préfères corriger plus tard.
      command: '{{.kubectl}} rollout undo deployment/{{.deployment}}{{if .scope}} {{.scope}}{{end}}'
      safe: true
  deepen:
    explanation: >-
      kubectl rollout status suit un rollout jusqu'à ce qu'il réussisse ou dépasse son
      échéance. L'échéance ne déclenche aucun retour arrière : c'est un signal, pour un humain
      ou un outil de déploiement.
    example: |-
      kubectl rollout status deployment/web --timeout=120s
      kubectl get deployment web -o jsonpath='{.spec.progressDeadlineSeconds}'
    exercise: >-
      Crée un namespace d'exercice avec « kubectl create namespace exo-echeance », crée un
      Deployment avec progressDeadlineSeconds: 30, donne-lui une image introuvable avec
      « kubectl set image », puis suis-le avec « kubectl rollout status ». Supprime le namespace
      ensuite.
  doc_url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#failed-deployment
  tests: [rollout-status-deadline]

# Feature 004 (US6, research.md F14) : retour à une révision absente de l'historique.
- id: rollout.undo-revision-missing
  category: rollout
  applies: [rollout undo]
  patterns:
    - 'unable to find specified revision (?P<revision>\d+) in history'
  concept:
    name: rollout history
    definition: >-
      Chaque modification du modèle de pod d'un Deployment crée un nouveau ReplicaSet, qui
      devient une révision de son historique. Seules les dernières révisions sont gardées
      (revisionHistoryLimit, 10 par défaut).
  summary: La révision {{.revision}} n'existe pas dans l'historique{{if .name}} de {{.type}}/{{.name}}{{end}}.
  cause: >-
    Cette révision n'a jamais existé (numéro mal choisi), ou elle a été effacée parce que
    l'historique ne garde que les révisions les plus récentes.
  fixes:
    - description: Lister les révisions disponibles, puis choisir un numéro de cette liste.
      command: '{{.kubectl}} rollout history {{if .name}}{{.type}}/{{.name}}{{else}}deployment/NOM{{end}}{{if .scope}} {{.scope}}{{end}}'
      safe: true
    - description: Revenir simplement à la révision précédente, sans numéro.
      command: '{{.kubectl}} rollout undo {{if .name}}{{.type}}/{{.name}}{{else}}deployment/NOM{{end}}{{if .scope}} {{.scope}}{{end}}'
      safe: true
  deepen:
    explanation: >-
      rollout undo ne restaure pas un fichier : il reprend le modèle de pod d'un ancien
      ReplicaSet. Une modification qui ne touche pas le modèle de pod (nombre de répliques)
      ne crée pas de révision. L'annotation kubernetes.io/change-cause, si elle est
      renseignée, apparaît dans la colonne CHANGE-CAUSE de l'historique.
    example: |-
      kubectl rollout history deployment/web
      kubectl rollout history deployment/web --revision=2
      kubectl get rs -l app=web
    exercise: >-
      Crée un namespace d'exercice avec « kubectl create namespace exo-historique », crée un
      Deployment, change deux fois son image, puis liste l'historique et reviens à la première
      révision. Supprime le namespace ensuite.
  doc_url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#rolling-back-a-deployment
  tests: [rollout-undo-revision-missing]

# Feature 004 (US1, research.md F4) : refus d'admission vu depuis un Deployment. Quand le
# refus est reconnu, la leçon affichée est celle de son entrée (quota, LimitRange,
# PodSecurity) ; celle-ci sert sinon.
- id: deployment.replica-failure
  category: rollout
  pitfalls: [deployment.replica-failure]
  concept:
    name: ReplicaSet
    definition: >-
      Un Deployment ne crée pas ses pods lui-même : il confie ce travail à un ReplicaSet. Si le
      serveur API refuse ces pods, la commande sur le Deployment a pourtant réussi.
  summary: 'Le ReplicaSet de « {{.deployment}} » ne peut pas créer ses pods : {{.refusal}}'
  cause: >-
    Les pods sont refusés à l'étape d'admission (quota, LimitRange, PodSecurity, webhook) ;
    la condition ReplicaFailure du Deployment recopie le refus.
  fixes:
    - description: Lire le refus dans les événements du ReplicaSet.
      command: '{{.kubectl}} describe rs -l {{.selector}}{{if .scope}} {{.scope}}{{end}}'
      safe: true
  deepen:
    explanation: >-
      « kubectl scale » ou « kubectl apply » ne modifient que le Deployment : c'est ensuite
      au ReplicaSet de créer les pods, et c'est à ce moment-là qu'ils sont refusés. Rien
      n'échoue côté kubectl.
    example: |-
      kubectl get deploy NOM -o jsonpath='{.status.conditions}'
      kubectl get events --field-selector reason=FailedCreate
    exercise: >-
      Crée un namespace d'exercice avec « kubectl create namespace exo-replicaset », ajoute un
      quota limits.cpu=1, déploie un Deployment à 500m de limite puis passe-le à trois
      répliques. Supprime le namespace ensuite.
  doc_url: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
  tests: [replica-failure]
